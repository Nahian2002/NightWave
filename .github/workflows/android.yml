      # NW77 audit is informational for PRIVATE debug builds. It deliberately
      # returns exit 2 for real public-release blockers and never approves a
      # public APK from a green build alone.
      - name: NW77 public music-source release audit (expected NO-GO for development)
        shell: bash
        run: |
          python3 tools/nw77_public_release_audit.py --self-test
          mkdir -p build
          set +e
          python3 tools/nw77_public_release_audit.py --project-root . --report build/NightWave-NW77-public-release-audit.json
          status=$?
          set -e
          if [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            echo "NW77 release auditor failed unexpectedly; do not infer readiness."
            exit 1
          fi
          echo "NW77 public release remains blocked or pending manual review. Debug CI continues."
      - name: Windows public release checker synthetic fixture
        shell: pwsh
        run: |
          ./tools/nw77-release-check.ps1 -SelfTest
      - name: Windows source guard cross-check on hosted PowerShell
        shell: pwsh
        run: |
          ./tools/check-nw52-integration.ps1 -SelfTest
          ./tools/check-nw52-integration.ps1 -ProjectRoot .
          ./tools/check-nw59-integration.ps1 -SelfTest
          ./tools/check-nw59-integration.ps1 -ProjectRoot .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Compiles and executes production Kotlin without an Android runtime.
      # Ubuntu toolchains differ: absence of standalone kotlinc is labeled
      # SKIP, not PASS; full Gradle Kotlin compile is still mandatory below.
      - name: NW90 cumulative NW81–NW89 source contracts
        run: |
          set -euo pipefail
          python3 tools/verify_nw81_titles.py
          python3 tools/verify_nw82_search.py
          python3 tools/verify_nw83_premium_visual.py
          python3 tools/verify_nw84_home.py
          python3 tools/verify_nw85_now_playing.py
          python3 tools/verify_nw86_library.py
          python3 tools/verify_nw87_transfer_offline.py
          python3 tools/verify_nw88_sound_studio.py
          python3 tools/verify_nw89_lyrics.py
          python3 tools/nw90_certification.py --self-test
          python3 tools/nw90_certification.py --project-root . --report build/NightWave-NW90-candidate-gates.json

      - name: Standalone Kotlin compiler smoke (when compiler present)
        run: |
          if command -v kotlinc >/dev/null 2>&1; then
            python3 tools/nw40_pure_kotlin_smoke.py
            python3 tools/nw44_kotlin_smoke.py
            python3 tools/nw10_kotlin_smoke.py
            python3 tools/nw12_verified_kotlin.py
            python3 tools/nw22_audio_core_smoke.py
            python3 tools/nw23_queue_smoke.py
            python3 tools/nw24_capacity_smoke.py
            python3 tools/nw25_adaptive_chrome_smoke.py
            python3 tools/nw26_reliability_smoke.py
            python3 tools/nw27_hardening_smoke.py
            python3 tools/nw27_state_smoke.py
            # NW75: compile FIVE real Kotlin source policies together, then
            # execute the exact cross-phase test harness; no Android SDK/data.
            kotlinc \
              app/src/main/java/com/nightwave/player/v2/library/SmartDiscoveryPoolPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/ui/StudioUiStateSafetyPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/cloud/CloudBackupFreshnessPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/cloud/CloudAccountSessionPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/cloud/CloudBackupConsentPolicy.kt \
              tools/NW75IntegrationSmoke.kt -include-runtime -d /tmp/nightwave-nw75-policy.jar
            java -jar /tmp/nightwave-nw75-policy.jar
          else
            echo "SKIP: standalone kotlinc not provisioned; Gradle Kotlin gate is required"
          fi
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug app, JVM tests and Android instrumentation sources
        run: |
          mkdir -p build
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin 2>&1 | tee build/nightwave-gradle.log
      - name: NW76 certify current JVM report before APK validation
        shell: pwsh
        run: |
          ./tools/nw76-junit-proof.ps1 -SelfTest
          ./tools/nw76-junit-proof.ps1 -ResultsDirectory app/build/test-results/testDebugUnitTest -OutputFile build/NightWave-jvm-test-proof.txt -MinimumTests 1000
      # This cannot run without an allocated runner; absence of the summary
      # then means infrastructure did not reach the compiler stage.
      - name: Summarize build failure without raw tokens or private paths
        if: failure()
        run: python3 tools/ci_compile_summary.py --log build/nightwave-gradle.log --output dist/nightwave-ci-build-summary.txt
      - name: Upload redacted failure summary (no APK)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NightWave-6H-build-diagnostic-NO-APK
          path: dist/nightwave-ci-build-summary.txt
          if-no-files-found: warn
          retention-days: 5
      - name: Upload NW77 release-source report (not an APK approval)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NightWave-NW77-public-release-NO-GO
          path: build/NightWave-NW77-public-release-audit.json
          if-no-files-found: warn
          retention-days: 5
      - name: Verify APK identity from compiled artifact
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "package: name='com.nightwave.player' versionCode='35' versionName='2.0.0-alpha5s'"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NightWave-NW52-dev-debug-NEEDS-SIGNER-DEVICE-QA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/NightWave-jvm-test-proof.txt
          if-no-files-found: error
          retention-days: 5
