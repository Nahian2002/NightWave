name: NightWave historical source diagnostics

# Development-branch builds and existing stacked PR gates only; never publish to main.
# CI debug APKs use GitHub's temporary debug signing identity and MUST NOT be
# installed over the user's existing music library without certificate checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightwave-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, JVM tests and Android test-source check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Source integrity, build recovery and official-first search checks
        run: |
          python3 tools/verify_source.py
          python3 tools/verify_nw40_stability.py --self-test
          python3 tools/verify_nw40_stability.py
          python3 tools/verify_nw43_queue.py --self-test
          python3 tools/verify_nw43_queue.py
          python3 tools/verify_nw44_search.py --self-test
          python3 tools/verify_nw44_search.py
          python3 tools/verify_nw45_drive.py --self-test
          python3 tools/verify_nw45_drive.py
