          python3 tools/verify_v2_phase6v7a.py
          python3 tools/verify_v2_phase6v7b.py --self-test
          python3 tools/verify_v2_phase6v7b.py
          python3 tools/ci_compile_summary.py --self-test
      # NW77 audit is informational for PRIVATE debug builds. It deliberately
      # returns exit 2 for real public-release blockers and never approves a
      # public APK from a green build alone.
      - name: NW77 public music-source release audit (expected NO-GO for development)
        shell: bash
        run: |
          python3 tools/nw77_public_release_audit.py --self-test
          mkdir -p build
          set +e
          python3 tools/nw77_public_release_audit.py --project-root . --report build/NightWave-NW77-public-release-audit.json
          status=$?
          set -e
          if [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            echo "NW77 release auditor failed unexpectedly; do not infer readiness."
            exit 1
          fi
          echo "NW77 public release remains blocked or pending manual review. Debug CI continues."
      - name: Windows public release checker synthetic fixture
        shell: pwsh
        run: |
          ./tools/nw77-release-check.ps1 -SelfTest
      - name: Windows source guard cross-check on hosted PowerShell
        shell: pwsh
        run: |
          ./tools/check-nw52-integration.ps1 -SelfTest
          ./tools/check-nw52-integration.ps1 -ProjectRoot .
          ./tools/check-nw59-integration.ps1 -SelfTest
          ./tools/check-nw59-integration.ps1 -ProjectRoot .
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Compiles and executes production Kotlin without an Android runtime.
      # Ubuntu toolchains differ: absence of standalone kotlinc is labeled
      # SKIP, not PASS; full Gradle Kotlin compile is still mandatory below.
      - name: NW90 cumulative NW81–NW89 source contracts
        run: |
          set -euo pipefail
          python3 tools/verify_nw81_titles.py
          python3 tools/verify_nw82_search.py
          python3 tools/verify_nw83_premium_visual.py
          python3 tools/verify_nw84_home.py
          python3 tools/verify_nw85_now_playing.py
          python3 tools/verify_nw86_library.py
          python3 tools/verify_nw87_transfer_offline.py
          python3 tools/verify_nw88_sound_studio.py
          python3 tools/verify_nw89_lyrics.py
          python3 tools/verify_nw90_final_audit.py
          python3 tools/nw90_certification.py --self-test
          python3 tools/verify_nw91_certification.py
          python3 tools/verify_nw92_storage.py
          python3 tools/verify_nw93_queue_recovery.py
          python3 tools/verify_nw94_playback.py
          python3 tools/verify_nw95_audio_route.py
          python3 tools/verify_nw96_equalizer.py
          python3 tools/verify_nw97_offline_transitions.py
          python3 tools/verify_nw98_background_intent.py
          python3 tools/verify_nw99_media_session.py
          python3 tools/verify_nw100_playback_audit.py
          python3 tools/verify_nw101_attestation.py --self-test
          python3 tools/verify_nw101_attestation.py
          python3 tools/verify_nw102_compiler_matrix.py
          python3 tools/nw103_receipt_selftest.py
          python3 tools/verify_nw103_build_pipeline.py
          python3 tools/verify_nw104_nested_enum_test_sources.py --self-test
          python3 tools/verify_nw104_nested_enum_test_sources.py
          python3 tools/verify_nw105_offline_junit.py
          python3 tools/verify_nw106_seek_timeline.py
          python3 tools/verify_nw107_lyrics_follow.py
          python3 tools/verify_nw108_playlist_identity.py
          python3 tools/verify_nw109_android36_privacy.py --self-test
          python3 tools/verify_nw109_android36_privacy.py --project-root .
          python3 tools/nw110_final_certification.py --self-test
          python3 tools/nw90_certification.py --project-root . --report build/NightWave-NW90-candidate-gates.json

      - name: NW101 PowerShell 5.1 attestation logic self-test
        shell: pwsh
        run: ./tools/nw101-source-attestation.ps1 -SelfTest

      # Independently execute NW97/NW100 original offline-policy JUnit methods.
      # Uses an enum adapter only for the unused public-queue implementation.
      - name: NW108 deterministic cloud playlist identity and real policy JUnit
        shell: bash
        run: |
          kotlinc app/src/main/java/com/nightwave/player/v2/data/PlaylistNameIdentity.kt \
            tools/NW108PlaylistNameSmoke.kt -include-runtime \
            -d /tmp/nightwave-nw108-playlists.jar
          java -jar /tmp/nightwave-nw108-playlists.jar
          python3 tools/nw108_name_junit_gate.py --report \
            build/nightwave-nw108-playlist-locale-junit.json

      - name: NW108 playlist-name JVM evidence (not cloud or Android approval)
        if: ${{ always() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: NightWave-NW108-PLAYLIST-JVM-ONLY-NO-ANDROID-APPROVAL
          path: build/nightwave-nw108-playlist-locale-junit.json
          if-no-files-found: warn
          retention-days: 7

      - name: NW107 accessible lyric-follow Kotlin and original JUnit tests
        shell: bash
        run: |
          kotlinc app/src/main/java/com/nightwave/player/v2/lyrics/TimedLyrics.kt \
            app/src/main/java/com/nightwave/player/v2/lyrics/LyricsSyncPolicy.kt \
            app/src/main/java/com/nightwave/player/v2/lyrics/LyricsReadingPolicy.kt \
            tools/NW107LyricsFollowSmoke.kt -include-runtime \
            -d /tmp/nightwave-nw107-lyrics.jar
          java -jar /tmp/nightwave-nw107-lyrics.jar
          python3 tools/nw107_lyrics_junit_gate.py \
            --report build/nightwave-nw107-lyrics-junit.json

      - name: NW107 lyric JVM source evidence (not Android/TalkBack approval)
        if: ${{ always() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: NightWave-NW107-LYRICS-JVM-ONLY-NO-ANDROID-APPROVAL
          path: build/nightwave-nw107-lyrics-junit.json
          if-no-files-found: warn
          retention-days: 7

      - name: NW106 seek geometry and accessibility policy regression
        shell: bash
        run: |
          kotlinc app/src/main/java/com/nightwave/player/v2/ui/NightWaveSeekGesturePolicy.kt \
            tools/NW106SeekTimelineSmoke.kt -include-runtime -d /tmp/nightwave-nw106-seek.jar
          java -jar /tmp/nightwave-nw106-seek.jar

      - name: NW105 compile and run real offline JUnit test source
        shell: bash
        run: |
          python3 tools/nw105_offline_junit_gate.py --self-test
          python3 tools/nw105_offline_junit_gate.py --report build/nightwave-nw105-offline-junit.json

      - name: NW105 offline JVM evidence (not public queue or Android)
        if: ${{ always() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: NightWave-NW105-OFFLINE-JVM-ONLY-NO-ANDROID-APPROVAL
          path: build/nightwave-nw105-offline-junit.json
          if-no-files-found: warn
          retention-days: 7

      - name: NW110 public queue 32,400 randomized source assertions
        shell: bash
        run: |
          kotlinc app/src/main/java/com/nightwave/player/playback/ShuffleRecoveryPolicy.kt \
            app/src/main/java/com/nightwave/player/playback/PlaybackQueue.kt \
            tools/NW110PublicQueueStress.kt -include-runtime -d /tmp/nightwave-nw110-stress.jar
          java -jar /tmp/nightwave-nw110-stress.jar

      - name: NW102 compile and run original Kotlin JUnit source tests
        shell: bash
        run: |
          python3 tools/nw102_kotlin_junit_gate.py --self-test
          python3 tools/nw103_receipt_selftest.py
          python3 tools/nw102_kotlin_junit_gate.py --report build/nightwave-nw102-jvm-source-tests.json

      # Final report always says NO_GO until external signer/device/rights gates
      # are independently verified; a fresh 53-method receipt is JVM-only.
      - name: NW110 fail-closed final certification status (not a release approval)
        if: always()
        shell: bash
        run: |
          python3 tools/nw110_final_certification.py --project-root . \
            --policy-receipt build/nightwave-nw102-jvm-source-tests.json \
            --report build/nightwave-nw110-final-certification.json

      - name: Upload NW110 final release NO-GO evidence
        if: ${{ always() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: NightWave-NW110-FINAL-CERTIFICATION-NO-GO
          path: build/nightwave-nw110-final-certification.json
          if-no-files-found: warn
          retention-days: 7

      # Available even when a later Gradle step fails. A NOT_VERIFIED JSON
      # status is never a passed compiler, JUnit or Android test run.
      - name: Upload NW103 exact-source JVM receipt (no Android approval)
        if: ${{ always() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: NightWave-NW103-JVM-EVIDENCE-NOT-ANDROID-APPROVAL
          path: build/nightwave-nw102-jvm-source-tests.json
          if-no-files-found: warn
          retention-days: 7

      - name: Standalone Kotlin compiler smoke (when compiler present)
        run: |
          if command -v kotlinc >/dev/null 2>&1; then
            python3 tools/nw40_pure_kotlin_smoke.py
            python3 tools/nw44_kotlin_smoke.py
            python3 tools/nw10_kotlin_smoke.py
            python3 tools/nw12_verified_kotlin.py
            python3 tools/nw22_audio_core_smoke.py
            python3 tools/nw23_queue_smoke.py
            python3 tools/nw24_capacity_smoke.py
            python3 tools/nw25_adaptive_chrome_smoke.py
            python3 tools/nw26_reliability_smoke.py
            python3 tools/nw27_hardening_smoke.py
            python3 tools/nw27_state_smoke.py
            # NW92 exact-source JVM verification with disposable private files.
            kotlinc app/src/main/java/com/nightwave/player/offline/OfflineFileRegistration.kt \
              tools/NW92OfflineFileRegistrationSmoke.kt -include-runtime \
              -d /tmp/nightwave-nw92-storage.jar
            java -jar /tmp/nightwave-nw92-storage.jar
            # NW93: exact-source pure Kotlin recovery policy with ten adversarial fixtures.
            kotlinc app/src/main/java/com/nightwave/player/playback/ShuffleRecoveryPolicy.kt \
              tools/NW93ShuffleRecoverySmoke.kt -include-runtime \
              -d /tmp/nightwave-nw93-history.jar
            java -jar /tmp/nightwave-nw93-history.jar
            # NW94 exact-source public bookmark identity failure scenarios.
            kotlinc app/src/main/java/com/nightwave/player/core/VideoLink.kt \
              app/src/main/java/com/nightwave/player/playback/ShuffleRecoveryPolicy.kt \
              app/src/main/java/com/nightwave/player/playback/PlaybackQueue.kt \
              app/src/main/java/com/nightwave/player/playback/QueueRestorePolicy.kt \
              app/src/main/java/com/nightwave/player/playback/PublicBookmarkCheckpointPolicy.kt \
              tools/NW94PublicBookmarkSmoke.kt -include-runtime -d /tmp/nightwave-nw94-bookmark.jar
            java -jar /tmp/nightwave-nw94-bookmark.jar
            # NW95: exact-source headset command policy and failure fixtures.
            kotlinc app/src/main/java/com/nightwave/player/playback/AudioRouteTransportPolicy.kt \
              tools/NW95AudioRouteTransportSmoke.kt -include-runtime \
              -d /tmp/nightwave-nw95-audio-route.jar
            java -jar /tmp/nightwave-nw95-audio-route.jar
            # NW96: actual pure-Kotlin EQ session guard and ten safety fixtures.
            kotlinc app/src/main/java/com/nightwave/player/playback/EqualizerSelectionPolicy.kt \
              tools/NW96EqualizerSessionSmoke.kt -include-runtime \
              -d /tmp/nightwave-nw96-equalizer.jar
            java -jar /tmp/nightwave-nw96-equalizer.jar
            # NW97: compile real offline/public queues and gapless policy.
            kotlinc app/src/main/java/com/nightwave/player/playback/ShuffleRecoveryPolicy.kt               app/src/main/java/com/nightwave/player/playback/PlaybackQueue.kt               app/src/main/java/com/nightwave/player/offline/OfflinePlaybackQueue.kt               app/src/main/java/com/nightwave/player/offline/OfflineGaplessPolicy.kt               tools/NW97PlaybackTransitionSmoke.kt -include-runtime               -d /tmp/nightwave-nw97-transitions.jar
            java -jar /tmp/nightwave-nw97-transitions.jar
            # NW98: production pending-play + widget command policies.
            kotlinc app/src/main/java/com/nightwave/player/playback/PlaybackResolutionPolicy.kt \
              app/src/main/java/com/nightwave/player/widget/WidgetPlaybackIntentPolicy.kt \
              tools/NW98BackgroundIntentSmoke.kt -include-runtime \
              -d /tmp/nightwave-nw98-background-intent.jar
            java -jar /tmp/nightwave-nw98-background-intent.jar
            # NW99: source-equivalent session authorization/queue routing cases.
            kotlinc app/src/main/java/com/nightwave/player/playback/MediaSessionQueueControlPolicy.kt \
              tools/NW99MediaSessionQueueSmoke.kt -include-runtime \
              -d /tmp/nightwave-nw99-session.jar
            java -jar /tmp/nightwave-nw99-session.jar
            # NW100: compile the real public/offline queues plus the NW99 policy.
            kotlinc app/src/main/java/com/nightwave/player/playback/ShuffleRecoveryPolicy.kt \
              app/src/main/java/com/nightwave/player/playback/PlaybackQueue.kt \
              app/src/main/java/com/nightwave/player/offline/OfflinePlaybackQueue.kt \
              app/src/main/java/com/nightwave/player/playback/MediaSessionQueueControlPolicy.kt \
              tools/NW100QueueAvailabilitySmoke.kt -include-runtime \
              -d /tmp/nightwave-nw100-playback.jar
            java -jar /tmp/nightwave-nw100-playback.jar
            # NW75: compile FIVE real Kotlin source policies together, then
            # execute the exact cross-phase test harness; no Android SDK/data.
            kotlinc \
              app/src/main/java/com/nightwave/player/v2/library/SmartDiscoveryPoolPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/ui/StudioUiStateSafetyPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/cloud/CloudBackupFreshnessPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/cloud/CloudAccountSessionPolicy.kt \
              app/src/main/java/com/nightwave/player/v2/cloud/CloudBackupConsentPolicy.kt \
              tools/NW75IntegrationSmoke.kt -include-runtime -d /tmp/nightwave-nw75-policy.jar
            java -jar /tmp/nightwave-nw75-policy.jar
          else
            echo "SKIP: standalone kotlinc not provisioned; Gradle Kotlin gate is required"
          fi
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile debug app, JVM tests and Android instrumentation sources
        run: |
          mkdir -p build
          # An old, green report must never cross into the current attempt.
          rm -rf app/build/test-results/testDebugUnitTest
          touch build/NightWave-NW91-attempt-start.txt
          set -o pipefail
          gradle --no-daemon --rerun-tasks --no-build-cache --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin 2>&1 | tee build/nightwave-gradle.log
      - name: NW76 certify current JVM report before APK validation
        shell: pwsh
        run: |
          ./tools/nw76-junit-proof.ps1 -SelfTest
          ./tools/nw76-junit-proof.ps1 -ResultsDirectory app/build/test-results/testDebugUnitTest -OutputFile build/NightWave-jvm-test-proof.txt -MinimumTests 1000
      - name: NW90 preserve exact current-build JUnit and APK evidence
        run: |
          python3 tools/nw90_certification.py --project-root . \
            --junit-dir app/build/test-results/testDebugUnitTest \
            --build-log build/nightwave-gradle.log \
            --attempt-marker build/NightWave-NW91-attempt-start.txt \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --report build/NightWave-NW90-after-build-gates.json
      - name: Upload NW90 no-public-release evidence receipts
        if: ${{ always() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: NightWave-NW90-evidence-NO-PUBLIC-APPROVAL
          path: |
            build/NightWave-NW90-candidate-gates.json
            build/NightWave-NW90-after-build-gates.json
          if-no-files-found: warn
          retention-days: 7
      # This cannot run without an allocated runner; absence of the summary
      # then means infrastructure did not reach the compiler stage.
      - name: Summarize build failure without raw tokens or private paths
        if: failure()
        run: python3 tools/ci_compile_summary.py --log build/nightwave-gradle.log --output dist/nightwave-ci-build-summary.txt
      - name: Upload redacted failure summary (no APK)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        if: ${{ failure() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        with:
          name: NightWave-6H-build-diagnostic-NO-APK
          path: dist/nightwave-ci-build-summary.txt
          if-no-files-found: warn
          retention-days: 5
      - name: Upload NW77 release-source report (not an APK approval)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        if: ${{ always() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        with:
          name: NightWave-NW77-public-release-NO-GO
          path: build/NightWave-NW77-public-release-audit.json
          if-no-files-found: warn
          retention-days: 5
      - name: Verify APK identity from compiled artifact
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "package: name='com.nightwave.player' versionCode='35' versionName='2.0.0-alpha5s'"
          sha256sum "$apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        if: ${{ success() && github.event.repository.private == true && github.event_name != 'pull_request' }}
        with:
          name: NightWave-NW52-dev-debug-NEEDS-SIGNER-DEVICE-QA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/NightWave-jvm-test-proof.txt
          if-no-files-found: error
          retention-days: 5
