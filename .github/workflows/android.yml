name: NightWave Android verification

# Only stacked development PR review branches are checked. Do not publish to main.
# CI debug APKs use GitHub's temporary debug signing identity and MUST NOT be
# installed over the user's existing music library without certificate checks.
on:
  pull_request:
    branches:
      - feature/nightwave-v2-phase5r-accessibility-build-gates
      - feature/nightwave-v2-phase5s-build-recovery
      - feature/nightwave-v2-phase5t-reliable-discovery
      - feature/nightwave-v2-phase5u-google-drive-backup
      # Phase 6F is explicitly the build-stabilization phase; run its
      # SOURCE/JVM/Android-test compile gate for PRs targeting latest 6E.
      # Never install an artifact or run instrumentation on a personal phone.
      - feature/nightwave-v2-phase6e-playback-health-continuity
      - feature/nightwave-v2-phase6g-playback-continuity-diagnostics
      - feature/nightwave-v2-phase6h-release-gates-resume-safety
      - feature/nightwave-v2-phase6h1-diagnostic-redaction-hotfix
      - feature/nightwave-v2-phase6h2-fillmaxsize-compile-hotfix
      - feature/nightwave-v2-phase6i-compact-editorial-ui
      - feature/nightwave-v2-phase6j-music-identity-discovery
      - feature/nightwave-v2-phase6k-service-sleep-timer
      - feature/nightwave-v2-phase6l-diverse-personal-mixes
      - feature/nightwave-v2-phase6m1-safe-playlist-sharing
      - feature/nightwave-v2-phase6m2-reviewed-playlist-import
      - feature/nightwave-v2-phase6n1-offline-playback-speed
      - feature/nightwave-v2-phase6n2-transition-fencing
      - feature/nightwave-v2-phase6n3-listening-level
      - feature/nightwave-v2-phase6o1-relevant-music-search
      - feature/nightwave-v2-phase6o2-saved-creator-browser
      - feature/nightwave-v2-phase6o3-premium-library-browsing
      - feature/nightwave-v2-phase6o4-library-quick-actions
      - feature/nightwave-v2-phase6p-integration-build-gate
      - feature/nightwave-v2-phase6q1-smart-drive-snapshots
      - feature/nightwave-v2-phase6q2-recovery-history
      - feature/nightwave-v2-phase6q3-optional-settings-lyrics-backup
      - feature/nightwave-v2-phase6r1-drive-audio-upload
      - feature/nightwave-v2-phase6r2-verified-cloud-downloads
      - feature/nightwave-v2-phase6r3-download-checkpoints
      - feature/nightwave-v2-phase6r3b-upload-session-recovery
      - feature/nightwave-v2-phase6v-integrated-build-audit
      - feature/nightwave-v2-phase6v1-receipt-contract-build-hardening
      - feature/nightwave-v2-phase6v2-offline-index-serialization
      - feature/nightwave-v2-phase6v4c-playback-recovery
      - feature/nightwave-v2-phase6v4d-integrated-release-gates
      - feature/nightwave-v2-phase6v5-music-vault-browser
      - feature/nightwave-v2-phase6v5b-transfer-journal-recovery
      - feature/nightwave-v2-phase6v5c-cursor-vault-scale
      - feature/nightwave-v2-phase6v6a-synced-lyrics-studio
      - feature/nightwave-v2-phase6v6b-safe-lrc-import-review
      - feature/nightwave-v2-phase6v6c-local-lrc-editor
      - feature/nightwave-v2-phase6v6d-lyrics-export-accessibility
  # Earlier phase Android/device tests were intentionally deferred.
  # Workflow dispatch stays available for controlled rechecks.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightwave-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, JVM tests and Android test-source check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Source integrity, build recovery and official-first search checks
        run: |
          python3 tools/verify_source.py
          python3 tools/verify_v2_phase5r.py
          python3 tools/verify_v2_phase5s.py
          python3 tools/verify_v2_phase5t.py
          python3 tools/verify_v2_phase5u.py
          python3 tools/verify_v2_phase5y.py
          python3 tools/verify_v2_phase5z.py
          python3 tools/verify_v2_phase6a.py
          python3 tools/verify_v2_phase6a2.py
          python3 tools/verify_v2_phase6a2d.py
          python3 tools/verify_v2_phase6b.py
          python3 tools/verify_v2_phase6c.py
          python3 tools/verify_v2_phase6c2.py
          python3 tools/verify_v2_phase6d.py
          python3 tools/verify_v2_phase6e.py
          python3 tools/verify_v2_phase6f.py
          python3 tools/verify_v2_phase6g.py
          python3 tools/verify_v2_phase6h.py
          python3 tools/verify_v2_phase6h1.py
          python3 tools/verify_v2_phase6h2.py
          python3 tools/verify_v2_phase6i.py
          python3 tools/verify_v2_phase6j.py
          python3 tools/verify_v2_phase6k.py
          python3 tools/verify_v2_phase6l.py
          python3 tools/verify_v2_phase6m1.py
          python3 tools/verify_v2_phase6m2.py
          python3 tools/verify_v2_phase6n1.py
          python3 tools/verify_v2_phase6n2.py
          python3 tools/verify_v2_phase6n3.py
          python3 tools/verify_v2_phase6o1.py
          python3 tools/verify_v2_phase6o2.py
          python3 tools/verify_v2_phase6o3.py
          python3 tools/verify_v2_phase6o4.py
          python3 tools/verify_v2_phase6p.py
          python3 tools/verify_v2_phase6q1.py
          python3 tools/verify_v2_phase6q2.py
          python3 tools/verify_v2_phase6q3.py
          python3 tools/verify_v2_phase6r1.py
          python3 tools/verify_v2_phase6r2.py
          python3 tools/verify_v2_phase6r3.py
          python3 tools/verify_v2_phase6r3b.py
          python3 tools/verify_v2_phase6v.py
          python3 tools/verify_v2_phase6v1.py
          python3 tools/verify_v2_phase6v2.py
          python3 tools/check-kotlin-internal-imports.py --self-test
          python3 tools/check-kotlin-internal-imports.py
          python3 tools/verify_v2_phase6v3.py
          python3 tools/verify_v2_phase6v4d.py --self-test
          python3 tools/verify_v2_phase6v4d.py
          python3 tools/verify_v2_phase6v5.py --self-test
          python3 tools/verify_v2_phase6v5.py
          python3 tools/verify_v2_phase6v5b.py --self-test
          python3 tools/verify_v2_phase6v5b.py
          python3 tools/verify_v2_phase6v5c.py --self-test
          python3 tools/verify_v2_phase6v5c.py
          python3 tools/verify_v2_phase6v6a.py --self-test
          python3 tools/verify_v2_phase6v6a.py
          python3 tools/verify_v2_phase6v6b.py --self-test
          python3 tools/verify_v2_phase6v6b.py
          python3 tools/verify_v2_phase6v6c.py --self-test
          python3 tools/verify_v2_phase6v6c.py
          python3 tools/ci_compile_summary.py --self-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug app, JVM tests and Android instrumentation sources
        run: |
          mkdir -p build
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin 2>&1 | tee build/nightwave-gradle.log
      # This cannot run without an allocated runner; absence of the summary
      # then means infrastructure did not reach the compiler stage.
      - name: Summarize build failure without raw tokens or private paths
        if: failure()
        run: python3 tools/ci_compile_summary.py --log build/nightwave-gradle.log --output dist/nightwave-ci-build-summary.txt
      - name: Upload redacted failure summary (no APK)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NightWave-6H-build-diagnostic-NO-APK
          path: dist/nightwave-ci-build-summary.txt
          if-no-files-found: warn
          retention-days: 5
      - name: Verify APK identity from compiled artifact
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "package: name='com.nightwave.player' versionCode='35' versionName='2.0.0-alpha5s'"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NightWave-6V6C-dev-debug-UNVERIFIED-FOR-DEVICE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
