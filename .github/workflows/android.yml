          python3 tools/verify_nw22_build_readiness.py
          python3 tools/audit_repo_nw22.py --self-test
          python3 tools/audit_repo_nw22.py
          python3 tools/verify_nw23_download_queue.py --self-test
          python3 tools/verify_nw23_download_queue.py
          python3 tools/verify_nw24_library.py --self-test
