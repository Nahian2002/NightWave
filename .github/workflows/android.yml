          pwsh -NoProfile -File tools/nw11-junit-report.ps1 -SelfTest
          pwsh -NoProfile -File tools/get-nw08-source-inputs.ps1 -SelfTest
          pwsh -NoProfile -File tools/check-nw07-source-gate.ps1 -SelfTest
          pwsh -NoProfile -File tools/check-nw07-source-gate.ps1
          python3 tools/verify_v2_phase5r.py
          python3 tools/verify_v2_phase5s.py
          python3 tools/verify_v2_phase5t.py
          python3 tools/verify_v2_phase5u.py
          python3 tools/verify_v2_phase5y.py
          python3 tools/verify_v2_phase5z.py
          python3 tools/verify_v2_phase6a.py
          python3 tools/verify_v2_phase6a2.py
          python3 tools/verify_v2_phase6a2d.py
          python3 tools/verify_v2_phase6b.py
          python3 tools/verify_v2_phase6c.py
          python3 tools/verify_v2_phase6c2.py
          python3 tools/verify_v2_phase6d.py
          python3 tools/verify_v2_phase6e.py
          python3 tools/verify_v2_phase6f.py
          python3 tools/verify_v2_phase6g.py
          python3 tools/verify_v2_phase6h.py
          python3 tools/verify_v2_phase6h1.py
          python3 tools/verify_v2_phase6h2.py
          python3 tools/verify_v2_phase6i.py
          python3 tools/verify_v2_phase6j.py
