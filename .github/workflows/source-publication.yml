name: Source publication safeguards

on:
  pull_request:
  push:
    branches: ['feature/**', 'fix/**', 'update/**', 'audit/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Verify publication boundaries and negative fixtures
        run: python .github/scripts/check_publication_controls.py --self-test
      - name: Verify this preparation did not change app or build inputs
        if: github.head_ref == 'audit/nightwave-public-source-preparation' || github.ref == 'refs/heads/audit/nightwave-public-source-preparation'
        run: python .github/scripts/check_publication_controls.py --verify-app-unchanged
      - name: Verify final source publication preserves the current app
        if: github.head_ref == 'audit/nightwave-source-publication-final' || github.ref == 'refs/heads/audit/nightwave-source-publication-final'
        run: python .github/scripts/check_publication_controls.py --verify-app-unchanged --protected-parent 736f014e6ff38d73f29e014057f3c398a83a63d3
      - name: Download checksum-pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan available Git history without exposing matches
        shell: bash
        run: |
          set -euo pipefail
          # Exact immutable reviewed fingerprints only; no inline allow comments.
          # Reports remain on this ephemeral runner and are never uploaded.
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history' \
            --ignore-gitleaks-allow --redact=100 --no-banner --log-level error \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-redacted.json"
