# Prepared dependency review only. Dependabot configuration is activated
# when committed to the GitHub default branch. It proposes PRs; it does not
# merge dependency changes into NightWave automatically.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
