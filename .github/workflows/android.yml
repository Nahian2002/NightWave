          python3 tools/verify_nw52_release.py --self-test
          python3 tools/verify_nw52_release.py --json
          python3 tools/verify_nw52_ui_prebuild.py --self-test
          python3 tools/verify_nw52_ui_prebuild.py
          python3 tools/verify_nw53_oauth_ui.py --self-test
          python3 tools/verify_nw53_oauth_ui.py
          python3 tools/verify_nw54_search_copy.py --self-test
          python3 tools/verify_nw54_search_copy.py
          python3 tools/verify_nw55_offline_chrome.py --self-test
          python3 tools/verify_nw55_offline_chrome.py
          python3 tools/verify_nw56_contrast.py --self-test
          python3 tools/verify_nw56_contrast.py
          python3 tools/verify_nw57_home.py --self-test
          python3 tools/verify_nw57_home.py
          python3 tools/verify_nw58_overlay.py --self-test
          python3 tools/verify_nw58_overlay.py
